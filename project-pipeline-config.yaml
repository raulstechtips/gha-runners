project-config:
  project-name: gha-runners
  project-description: "Helm chart for GitHub Actions runner scale sets"
  project-namespace: arc-runners
  publish-targets: [ghcr]
  argo-deploy-targets:
    - gha-runners
    - gha-runners-packer
  pipeline-steps:
