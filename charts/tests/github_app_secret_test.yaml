suite: GitHub App Secret migration
templates:
  - templates/github-app-secret.yaml
release:
  name: gha-runners
  namespace: arc-runners
tests:
  - it: is disabled by default
    asserts:
      - hasDocuments:
          count: 0
  - it: keeps the target name and exact key mapping without owning the Secret
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - isAPIVersion:
          of: secrets.infisical.com/v1beta1
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: metadata.name
          value: arc-github-app
      - equal:
          path: spec.targets[0].name
          value: arc-github-app
      - equal:
          path: spec.targets[0].namespace
          value: arc-runners
      - equal:
          path: spec.targets[0].creationPolicy
          value: Orphan
      - equal:
          path: spec.targets[0].secretType
          value: Opaque
      - equal:
          path: spec.targets[0].metadata
          value: {labels: {}, annotations: {}}
      - equal:
          path: spec.targets[0].template.data
          value:
            github_app_id: "{{ .APP_ID.Value }}"
            github_app_installation_id: "{{ .INSTALLATION_ID.Value }}"
            github_app_private_key: "{{ .PRIVATE_KEY.Value }}"
      - equal:
          path: spec.sources[0]
          value:
            projectSlug: fake-project
            environmentSlug: fake-env
            secretPath: /github/arc
            recursive: true
      - equal:
          path: spec.syncOptions.refreshInterval
          value: 60s
      - equal:
          path: spec.infisicalAuthRef
          value: {name: fake-auth, namespace: fake-secrets}
