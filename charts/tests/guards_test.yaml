suite: Wrapper guards and schema
templates:
  - templates/github-app-secret.yaml
  - templates/packer-service.yaml
tests:
  - it: requires infisical.authRef.name when syncing
    template: templates/github-app-secret.yaml
    values:
      - ../ci/all-on-values.yaml
    set:
      infisical.authRef.name: ""
    asserts:
      - failedTemplate:
          errorMessage: infisical.authRef.name is required when githubAppSecret.enabled is enabled
  - it: requires infisical.authRef.namespace when syncing
    template: templates/github-app-secret.yaml
    values:
      - ../ci/all-on-values.yaml
    set:
      infisical.authRef.namespace: ""
    asserts:
      - failedTemplate:
          errorMessage: infisical.authRef.namespace is required when githubAppSecret.enabled is enabled
  - it: requires infisical.projectSlug when syncing
    template: templates/github-app-secret.yaml
    values:
      - ../ci/all-on-values.yaml
    set:
      infisical.projectSlug: ""
    asserts:
      - failedTemplate:
          errorMessage: infisical.projectSlug is required when githubAppSecret.enabled is enabled
  - it: requires infisical.environmentSlug when syncing
    template: templates/github-app-secret.yaml
    values:
      - ../ci/all-on-values.yaml
    set:
      infisical.environmentSlug: ""
    asserts:
      - failedTemplate:
          errorMessage: infisical.environmentSlug is required when githubAppSecret.enabled is enabled
  - it: requires an address when the service is enabled
    template: templates/packer-service.yaml
    set:
      packerService.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: packerService.loadBalancerIP is required when packerService.enabled is enabled
  - it: requires a port when the service is enabled
    template: templates/packer-service.yaml
    set:
      packerService.enabled: true
      packerService.loadBalancerIP: 192.0.2.181
    asserts:
      - failedTemplate:
          errorMessage: packerService.port is required when packerService.enabled is enabled
  - it: requires a target port when the service is enabled
    template: templates/packer-service.yaml
    set:
      packerService.enabled: true
      packerService.loadBalancerIP: 192.0.2.181
      packerService.port: 8802
    asserts:
      - failedTemplate:
          errorMessage: packerService.targetPort is required when packerService.enabled is enabled
  - it: rejects unknown wrapper keys
    template: templates/github-app-secret.yaml
    set:
      githubAppSecret.foo: x
    asserts:
      - failedTemplate:
          errorMessage: |
            values don't meet the specifications of the schema(s) in the following chart(s):
            gha-runners:
            - githubAppSecret: Additional property foo is not allowed
  - it: rejects a quoted boolean
    template: templates/github-app-secret.yaml
    set:
      githubAppSecret.enabled: "true"
    asserts:
      - failedTemplate:
          errorMessage: |
            values don't meet the specifications of the schema(s) in the following chart(s):
            gha-runners:
            - githubAppSecret.enabled: Invalid type. Expected: boolean, given: string
  - it: leaves upstream values open
    template: templates/github-app-secret.yaml
    set:
      gha-runner-scale-set.anyUpstreamKey: x
    asserts:
      - hasDocuments:
          count: 0
