{{- if .Values.githubAppSecret.enabled }}
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Values.githubAppSecret.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gha-runners-wrapper.labels" . | nindent 4 }}
spec:
  infisicalAuthRef:
    name: {{ required "infisical.authRef.name is required when githubAppSecret.enabled is enabled" .Values.infisical.authRef.name | quote }}
    namespace: {{ required "infisical.authRef.namespace is required when githubAppSecret.enabled is enabled" .Values.infisical.authRef.namespace | quote }}
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: {{ required "infisical.projectSlug is required when githubAppSecret.enabled is enabled" .Values.infisical.projectSlug | quote }}
      environmentSlug: {{ required "infisical.environmentSlug is required when githubAppSecret.enabled is enabled" .Values.infisical.environmentSlug | quote }}
      secretPath: {{ .Values.githubAppSecret.secretPath | quote }}
      recursive: {{ .Values.githubAppSecret.recursive }}
  targets:
    - name: {{ .Values.githubAppSecret.secretName }}
      namespace: {{ .Release.Namespace }}
      kind: Secret
      secretType: Opaque
      creationPolicy: Orphan
      metadata:
        labels: {}
        annotations: {}
      template:
        engineVersion: v1
        data:
          github_app_id: {{ "{{ .APP_ID.Value }}" | quote }}
          github_app_installation_id: {{ "{{ .INSTALLATION_ID.Value }}" | quote }}
          github_app_private_key: {{ "{{ .PRIVATE_KEY.Value }}" | quote }}
{{- end }}
